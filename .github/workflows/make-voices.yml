# Makes the Hebrew voice files with Gemini and commits them to this branch.
# Needs a repository secret named GEMINI_API_KEY.
name: Make voice files

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/make-voices.yml
      - tools/make_voices.py

permissions:
  contents: write

jobs:
  voices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Make the mp3 files
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Add the GEMINI_API_KEY repository secret, then re-run this job."
            exit 1
          fi
          python3 tools/make_voices.py
          ls -l assets/voice
      - name: Commit the files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add assets/voice
          git diff --cached --quiet && exit 0
          git commit -m "Add Hebrew voice files made with Gemini"
          git push
