# Makes the Hebrew voice files with Gemini and commits them to this branch.
# Needs a repository secret named GEMINI_API_KEY.
name: Make voice files

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/make-voices.yml
      - tools/make_voices.py
      - tools/check_voices.py
      - tools/remake.txt

permissions:
  contents: write

jobs:
  voices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Make the mp3 files and check them
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Add the GEMINI_API_KEY repository secret, then re-run this job."
            exit 1
          fi
          # Use the 2.5 Pro TTS model (each TTS model has its own 100-a-day limit).
          curl -sS -H "x-goog-api-key: $GEMINI_API_KEY" \
            "https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000" > models.json
          GEMINI_TTS_MODEL=$(python3 -c "
          import json, sys
          names = [m['name'].split('/')[-1] for m in json.load(open('models.json')).get('models', [])]
          tts = [n for n in names if 'tts' in n]
          print('TTS models:', ', '.join(tts), file=sys.stderr)
          pick = [n for n in ('gemini-2.5-pro-tts', 'gemini-2.5-pro-preview-tts') if n in tts]
          sys.exit('No 2.5 Pro TTS model') if not pick else print(pick[0])
          ")
          rm models.json
          export GEMINI_TTS_MODEL
          echo "GEMINI_TTS_MODEL=$GEMINI_TTS_MODEL" >> "$GITHUB_ENV"
          echo "Using $GEMINI_TTS_MODEL"
          # tools/remake.txt (if there) lists just the ids to remake; otherwise all are remade.
          if [ -s tools/remake.txt ]; then python3 tools/make_voices.py $(cat tools/remake.txt) || true
          else python3 tools/make_voices.py --all || true; fi
          # A Gemini model listens to every file; any file that doesn't say its sentence is made again.
          for round in 1 2 3; do
            if python3 tools/check_voices.py; then rm -f bad_voices.txt; exit 0; fi
            python3 tools/make_voices.py $(cat bad_voices.txt) || true
          done
          python3 tools/check_voices.py
      - name: Commit the files
        run: |
          rm -f bad_voices.txt
          git rm -q --ignore-unmatch tools/remake.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add assets/voice
          git diff --cached --quiet && exit 0
          git commit -m "Remake Hebrew voice files with ${GEMINI_TTS_MODEL:-gemini-2.5-flash-preview-tts} (all checked)"
          git push
